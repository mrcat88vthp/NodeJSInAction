<!DOCTYPE html>
<html>
    <head>
        <title>Upload</title>
        <script src="script.js" type="text/javascript"></script>
    </head>
    <body>
        <h2>Upload File</h2>

        <input type="file" id="file" />

        <button onclick="upload()">
            Upload
        </button>
        <button onclick="cancelUpload()">
            Cancel upload
        </button>

        <progress 
            id="progress"
            value="0"
            max="100"
            style="width: 400px;"
            >
        </progress> 

        <span id="percent">0%</span>
    </body>
</html>
